<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
    <link rel ="stylesheet" href="assets/css/adminlogin.css">
    
</head>
<body class="body-adminlogin">
    <div class="container mt-4">
     <img src="assets/img/pipeline_logo_light.png" class="img-fluid img-logo" alt="Pipeline Logo">
    </div>

    <div>
        <hr style="height:4px; width: 100%; border: none; background-color: white; color: white;">
    </div>

     <div class="container mt-4">
       
        <div class="row justify-content-between">

            <div class="col-md-6" style="padding-right: 80px;">
                    <img src="assets/img/login_img_admin.png" class="img-login" alt="Pipeline Logo">

            </div>

            <div class="col-md-6 justify-content-start" style="padding-left: 60px;">
                 <h1 class="mt-5 h1" style="color: #dde5b6">Hello Pipeline Admin!</h1>
                <h6 class="mb-4 h4">Please login to continue</h6>
                <form>

                    <div class="mb-3">
                        <label for="email" class="form-label field-label">Admin Username</label>
                        <input type="email" class="form-control field" id="email">
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label field-label">Password</label>
                        <input type="password" class="form-control field" id="password">
                    </div>

                    <button type="submit" class="btn btn-size fw-bold dm-sans btn-color">LOGIN</button>
                    <hr style="height:2px; width: 70%;">


        

                </form>

        
            </div>

            

            </div>
                
        </div>

    

    
</body>
</html>

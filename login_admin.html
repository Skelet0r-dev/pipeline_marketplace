<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pipeline — Admin Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/adminlogin.css">
</head>
<body>

<div class="page-wrap">

    <!-- Navbar -->
    <div class="login-navbar">
        <img src="assets/img/pipeline_wireframe-removebg.png" alt="Pipeline Logo" class="navbar-logo">
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="login-card">

            <!-- Left: Form (narrower) -->
            <div class="panel-left">
                <h1 class="login-greeting">Hello Pipeline Admin!</h1>
                <p class="login-sub">Please log in to your admin account to continue</p>

                <form action="login_admin.php" method="POST">

                    <div class="field-group">
                        <label class="field-label" for="username">Admin Username</label>
                        <input
                            class="field-input"
                            type="text"
                            id="username"
                            name="username"
                            placeholder="Enter admin username"
                            autocomplete="username"
                            required
                        >
                    </div>

                    <div class="field-group" style="margin-bottom: 24px;">
                        <label class="field-label" for="password">Password</label>
                        <input
                            class="field-input"
                            type="password"
                            id="password"
                            name="password"
                            autocomplete="current-password"
                        >
                    </div>

                    <button type="submit" class="btn-login">LOGIN</button>

                </form>

                <div class="login-divider"></div>

                <div class="login-footer">
                    <div class="signup-row">
                        <a href="login.html">&#8592; Back to Student Login</a>
                    </div>
                </div>
            </div>

            <!-- Right: Image (wider, fills panel) -->
            <div class="panel-right">
                <img src="assets/img/admin_panel.png" alt="Admin panel preview">
            </div>

        </div>
    </div>

    <!-- Site Footer -->
    <footer class="site-footer">
        <div class="footer-brand">
            <img src="assets/img/pipeline_wireframe-removebg.png" alt="Pipeline Logo" class="footer-logo">
            <p class="footer-trustmark">
                E-Commerce TrustMark Application submitted and pending approval (Ref No: 251009-13191661)
            </p>
        </div>

        <div class="footer-links">
            <a href="#">Help Centre</a><span class="sep">|</span>
            <a href="#">Contact us</a><span class="sep">|</span>
            <a href="#">Press</a><span class="sep">|</span>
            <a href="#">Privacy</a>
            <br>
            <a href="#">Terms</a><span class="sep">|</span>
            <a href="#">Business Conduct</a><span class="sep">|</span>
            <a href="login.html">Student Login</a>
        </div>
    </footer>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>

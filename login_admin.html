<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/adminlogin.css">
</head>
<body class="body-adminlogin">

    <!-- Header -->
    <div class="admin-header">
        <img src="assets/img/pipeline_logo_light.png" class="img-logo-admin" alt="Pipeline Logo">
        <div class="admin-header-tag">👨‍💻 ADMIN PORTAL </div>
    </div>

    <!-- Main -->
    <div class="admin-wrapper">
        <div class="admin-card">

            <!-- Left: Image -->
            <div class="admin-left">
                <img src="assets/img/login_img_admin.png" class="admin-img" alt="Admin Image">
            </div>

            <!-- Divider -->
            <div class="admin-divider"></div>

            <!-- Right: Form -->
            <div class="admin-right">
                <div class="admin-form-header">
                    <div class="admin-label-small">RESTRICTED ACCESS ⚠️</div>
                    <h1 class="admin-title">Hello Pipeline Admin!</h1>
                    <p class="admin-sub">Please login to continue</p>
                </div>

                <form action="admin_dashboard.html" method="POST">
                    <div class="mb-3">
                        <label for="tezt" class="admin-field-label">Admin Username</label>
                        <input type="text" class="admin-input" id="text">
                    </div>

                    <div class="mb-4">
                        <label for="password" class="admin-field-label">Password</label>
                        <input type="password" class="admin-input" id="password" name="password">
                    </div>

                    <button type="submit" class="btn-admin-login">LOGIN</button>
                </form>

                <hr class="admin-hr">

                <p class="admin-back">
                    <a href="login.html" class="admin-link">&#8592; Back to Student Login</a>
                </p>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>

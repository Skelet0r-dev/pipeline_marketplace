<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/regis.css">

</head>
<body>
    <div class="container mt-4">
     <img src="assets/img/pipeline_wireframe-removebg.png" class=" img-logo" alt="Pipeline Logo">
    </div>

    <div>
        <hr class="hr-style">        
    </div>

<form action="regis.php" method="POST" enctype="multipart/form-data">
    <div class="container mt-6 d-flex justify-content-between align-items-center" style="padding-top: 50px;">

        <!-- Left side: Image -->
        <div class="col-md-5">
            <img src="assets/img/regis_img.png" class="img-regis img-fluid" alt="regis_img">

            <div class="text-center mt-4">
          
                    <label for="image" class="btn btn-primary w-75 btn-create" style="cursor: pointer;">
                        UPLOAD IMAGE
                      </label>
                      <input type="file" name="image" id="image" class="form-control mb-3" style="display: none;">
            </div> 


        </div>
        <!-- Right side: Form -->
        <div class="col-md-6">
            <h1 class="text-start mb-4 h1">Create an Account</h1>
    
                <div class="mb-3">
                    <div class="d-flex justify-content-between gap-3">
                        <div class="w-100">
                            <label for="firstname" class="form-label field-label">First Name</label>
                            <input type="text" class="form-control" id="f_name" name="f_name" required>
                        </div>
                        <div class="w-100">
                            <label for="lastname" class="form-label field-label">Last Name</label>
                            <input type="text" class="form-control" id="l_name" name="l_name" required>
                        </div>
                    </div>
                </div>
    
                <div class="mb-3">
                    <div class="d-flex justify-content-between gap-3">
                        <div class="w-100">
                            <label for="stdnum" class="form-label field-label">Student Number</label>
                            <input type="text" class="form-control" id="stdnum" name="stdnum" required>
                        </div>
                        <div class="w-100">
                            <label for="cys" class="form-label field-label">Course Section</label>
                            <input type="text" class="form-control" id="cys" name="cys" required>
                        </div>
                    </div>
                </div>
    
                <div class="mb-3">
                    <label for="username" class="form-label field-label">Username</label>
                    <input type="text" class="form-control" id="username" name="username" required>
                </div>
    
                <div class="mb-3">
                    <label for="email" class="form-label field-label">Email address</label>
                    <input type="email" class="form-control" id="email" name="email" required>
                </div>
    
                <div class="mb-3">
                    <label for="password" class="form-label field-label">Password</label>
                    <input type="password" class="form-control" id="password" name="password" required>
                </div>
    
                <div class="d-flex justify-content-end gap-3">
                    <button type="reset" class="btn btn-secondary w-50 btn-cancel">Cancel</button>
                    <button type="submit" class="btn btn-primary w-50 btn-create">Register</button>
                </div>
    
         
        </div>
    </div>
</form>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>

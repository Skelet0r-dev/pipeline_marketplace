<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/regis.css">
</head>
<body>

    <!-- Header -->
    <div class="regis-header">
        <img src="assets/img/pipeline_wireframe-removebg.png" class="img-logo-light" alt="Pipeline Logo">
        <div class="header-tagline">&#10022; Your campus marketplace &#10022;</div>
    </div>

    <!-- Main card -->
    <div class="regis-wrapper">
        <div class="regis-card">

            <!-- FORM wraps everything so file input is included -->
            <form action="regis.php" method="POST" enctype="multipart/form-data" style="display:contents;">

                <!-- Left: photo -->
                <div class="regis-left">
                    <div class="photo-preview-box">
                        <img src="assets/img/regis_img.png" id="imagePreview" alt="Preview">
                    </div>
                    <label for="image" class="upload-btn">UPLOAD IMAGE</label>
                    <input type="file" name="image" id="image" accept=".jpg" style="display:none;" onchange="previewImage(this)">
                    <p class="file-name" id="fileName">No file chosen</p>
                </div>

                <!-- Divider -->
                <div class="regis-divider"></div>

                <!-- Right: form fields -->
                <div class="regis-right">
                    <div class="regis-form-header">
                        <div class="form-label-small">👥 NEW ACCOUNT</div>
                        <h1 class="regis-title">Create an Account</h1>
                    </div>

                    <div class="d-flex gap-3 mb-3">
                        <div class="w-100">
                            <label class="field-label">First Name</label>
                            <input type="text" class="regis-input" name="f_name" placeholder="Juan" required>
                        </div>
                        <div class="w-100">
                            <label class="field-label">Last Name</label>
                            <input type="text" class="regis-input" name="l_name" placeholder="Dela Cruz" required>
                        </div>
                    </div>

                    <div class="d-flex gap-3 mb-3">
                        <div class="w-100">
                            <label class="field-label">Student Number</label>
                            <input type="text" class="regis-input" name="stdnum" placeholder="202012345" required>
                        </div>
                        <div class="w-100">
                            <label class="field-label">Course Year Section</label>
                            <input type="text" class="regis-input" name="cys" placeholder="CEE11" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="field-label">Username</label>
                        <input type="text" class="regis-input" name="username" placeholder="juan_delacruz" required>
                    </div>

                    <div class="mb-3">
                        <label class="field-label">School Email Address</label>
                        <input type="email" class="regis-input" name="email" placeholder="djc2345@dlsud.edu.ph" required>
                    </div>

                    <div class="mb-4">
                        <label class="field-label">Password</label>
                        <input type="password" class="regis-input" name="password" required>
                    </div>

                    <div class="d-flex gap-3">
                        <a href="login.html" class="btn-cancel w-50 text-center text-decoration-none">Cancel</a>
                        <button type="submit" class="btn-register w-50">Register</button>
                    </div>

                </div>

            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script>
        function previewImage(input) {
            document.getElementById('fileName').innerHTML = input.files[0].name;
            document.getElementById('imagePreview').src = URL.createObjectURL(input.files[0]);
        }

    </script>

</body>
</html>

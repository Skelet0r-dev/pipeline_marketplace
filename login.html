<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="body">

    <div class="container mt-4">
     <img src="assets/img/pipeline_wireframe-removebg.png" class=" img-logo" alt="Pipeline Logo">
     
    </div>

    <div>
        <hr style="height:3px;">
    </div>

    <div class="container mt-4">
       
        <div class="row justify-content-between">
            <div class="col-md-6 justify-content-start">
                 <h1 class="mt-5 h1">Hello Lassallian!</h1>
                <h6 class="mb-4 h4">Please login to continue</h6>
                <form>

                    <div class="mb-3">
                        <label for="email" class="form-label field-label">Student ID Number or Student Name</label>
                        <input type="email" class="form-control field" id="email">
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label field-label">Password</label>
                        <input type="password" class="form-control field" id="password">
                    </div>

                    <button type="submit" class="btn btn-size fw-bold dm-sans" style="background-color: #936639; color: white;">LOGIN</button>
                    <hr style="height:3px;">

                </form>

                <div class="d-flex justify-content-between col-md-12">
                    <a href="#" style="color: #936639;">Forgot password?</a>
                <p class="text-center">Don't have an account? <a href="signup.html" style="color: #936639;">Sign up here</a></p>
                </div>
            </div>

            <div class="col-md-6" style="padding-left: 100px;">
                    <img src="assets/img/login_image_wframe.png" class="img-login" alt="Pipeline Logo">

            </div>

            </div>
                
        </div>


            

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
